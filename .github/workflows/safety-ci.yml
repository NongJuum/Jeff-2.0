name: Safety CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/safety-factor-injury-coverage"]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
